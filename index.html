<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kapoore Art CRM</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#6b4226">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KA CRM">

<style>
  :root{ --primary:#6b4226; --secondary:#c9a26d; --bg:#f5f2ee; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Segoe UI', Arial, sans-serif; background:linear-gradient(160deg, var(--bg), #efe6d8);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #screenPin{ width:100%; max-width:360px; padding:24px; text-align:center; }
  .logo{ width:76px; height:76px; border-radius:50%; margin:0 auto 14px; display:block; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  h1{ font-size:1.25rem; color:var(--primary); margin:0 0 4px; }
  p.sub{ font-size:.85rem; color:#888; margin:0 0 24px; }
  .dots{ display:flex; justify-content:center; gap:14px; margin-bottom:26px; }
  .dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--primary); background:transparent; transition:background .15s; }
  .dot.filled{ background:var(--primary); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:280px; margin:0 auto; }
  .key{
    aspect-ratio:1; border-radius:50%; border:1px solid #e4ddd3; background:#fff; font-size:1.4rem; font-weight:600;
    color:var(--primary); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
    box-shadow:0 3px 8px rgba(0,0,0,.06);
  }
  .key:active{ background:var(--primary); color:#fff; transform:scale(.96); }
  .key.ghost{ background:transparent; box-shadow:none; border:none; }
  .error-msg{ color:#c0392b; font-size:.82rem; height:18px; margin-bottom:10px; }
  .spinner{ display:none; width:22px; height:22px; border:3px solid #eee; border-top-color:var(--primary); border-radius:50%; margin:8px auto; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #screenSetup, #screenIframe{ display:none; }
  #screenSetup{ width:100%; max-width:360px; padding:24px; text-align:center; }
  #screenSetup input{ width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; margin:12px 0; font-size:.9rem; }
  #screenSetup button{ width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-weight:600; }

  #screenIframe{ position:fixed; inset:0; width:100%; height:100%; }
  #adminFrame{ width:100%; height:100%; border:none; }

  #installBtn{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--primary); color:#fff;
    border:none; padding:11px 20px; border-radius:30px; font-size:.85rem; font-weight:600; display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:50;
  }
  .ios-hint{ font-size:.75rem; color:#999; margin-top:16px; display:none; }
</style>
</head>
<body>

<!-- ===== First-time Web App URL setup ===== -->
<div id="screenSetup">
  <img class="logo" src="./icon-192.png" alt="logo">
  <h1>One-time Setup</h1>
  <p class="sub">Apna Google Apps Script Web App URL paste karo (Apps Script deploy karne ke baad milta hai).</p>
  <input type="text" id="setupUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <button onclick="saveWebAppUrl()">Save &amp; Continue</button>
</div>

<!-- ===== PIN screen ===== -->
<div id="screenPin">
  <img class="logo" src="./icon-192.png" alt="logo">
  <h1>Kapoore Art CRM</h1>
  <p class="sub">Enter your quick-access PIN</p>
  <div class="error-msg" id="pinError"></div>
  <div class="dots" id="pinDots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="spinner" id="pinSpinner"></div>
  <div class="keypad" id="keypad">
    <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
    <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
    <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
    <div class="key ghost" onclick="resetSetup()" style="font-size:.7rem;">Reset URL</div>
    <div class="key" onclick="press('0')">0</div>
    <div class="key" onclick="backspace()">⌫</div>
  </div>
  <p class="ios-hint" id="iosHint">Home screen pe install karne ke liye: Share button → "Add to Home Screen"</p>
</div>

<button id="installBtn" onclick="installApp()">⬇ Install App</button>

<!-- ===== Admin iframe (after PIN success) ===== -->
<div id="screenIframe">
  <iframe id="adminFrame"></iframe>
</div>

<script>
  var pin = '';
  var deferredInstallPrompt = null;

  // ---------- Web App URL setup (stored locally on this device only) ----------
  function getWebAppUrl(){ return localStorage.getItem('ka_webapp_url') || ''; }
  function saveWebAppUrl(){
    var url = document.getElementById('setupUrl').value.trim();
    if(!url.startsWith('https://script.google.com/')){
      alert('Valid Apps Script Web App URL daalo (script.google.com se shuru hona chahiye)');
      return;
    }
    if(!url.endsWith('/exec')) url = url.replace(/\/$/, '') + (url.includes('/exec') ? '' : '/exec');
    localStorage.setItem('ka_webapp_url', url);
    showPinScreen();
  }
  function resetSetup(){
    if(!confirm('Web App URL reset karke dobara setup karna hai?')) return;
    localStorage.removeItem('ka_webapp_url');
    location.reload();
  }

  function showPinScreen(){
    document.getElementById('screenSetup').style.display = 'none';
    document.getElementById('screenPin').style.display = 'block';
  }

  (function init(){
    if(!getWebAppUrl()){
      document.getElementById('screenSetup').style.display = 'block';
    } else {
      showPinScreen();
    }
    // iOS doesn't support beforeinstallprompt — show a manual hint instead
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if(isIOS) document.getElementById('iosHint').style.display = 'block';
  })();

  // ---------- PIN pad ----------
  function updateDots(){
    var dots = document.querySelectorAll('.dot');
    dots.forEach(function(d, i){ d.classList.toggle('filled', i < pin.length); });
  }
  function press(d){
    if(pin.length >= 6) return;
    pin += d;
    updateDots();
    if(pin.length >= 4){
      // small debounce so user can enter 5/6-digit pins too
      clearTimeout(window._pinTimer);
      window._pinTimer = setTimeout(function(){ if(pin.length >= 4) verifyPin(); }, 350);
    }
  }
  function backspace(){
    pin = pin.slice(0, -1);
    updateDots();
    document.getElementById('pinError').textContent = '';
  }

  function verifyPin(){
    document.getElementById('pinSpinner').style.display = 'block';
    document.getElementById('keypad').style.opacity = '0.5';
    fetch(getWebAppUrl(), {
      method: 'POST',
      body: JSON.stringify({ action: 'verifyPin', pin: pin })
    }).then(function(r){ return r.json(); }).then(function(res){
      document.getElementById('pinSpinner').style.display = 'none';
      document.getElementById('keypad').style.opacity = '1';
      if(res.success){
        loadAdmin(res.token);
      } else {
        document.getElementById('pinError').textContent = res.message || 'Incorrect PIN';
        pin = ''; updateDots();
      }
    }).catch(function(){
      document.getElementById('pinSpinner').style.display = 'none';
      document.getElementById('keypad').style.opacity = '1';
      document.getElementById('pinError').textContent = 'Connection error. Check your internet.';
      pin = ''; updateDots();
    });
  }

  function loadAdmin(token){
    document.getElementById('screenPin').style.display = 'none';
    document.getElementById('installBtn').style.display = 'none';
    document.getElementById('screenIframe').style.display = 'block';
    document.getElementById('adminFrame').src = getWebAppUrl() + '?page=admin&token=' + encodeURIComponent(token);
  }

  // ---------- PWA install ----------
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
  });
  function installApp(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function(){
      deferredInstallPrompt = null;
      document.getElementById('installBtn').style.display = 'none';
    });
  }

  // ---------- Service worker ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
